name: Release

# Publica qualquer versão presente na main que ainda não foi lançada: cria a
# tag + Release no GitHub e publica no npm com --provenance (build rastreável
# a este repositório, commit e execução). Idempotente — tag já criada e versão
# já publicada são puladas, então re-executar é sempre seguro. Se a versão do
# HEAD já foi publicada a partir de OUTRO commit com dataset diferente, o run
# falha de propósito (é preciso um bump novo — nunca terminar verde com o npm
# para trás da main). Falhas abrem/atualizam a issue "Release automático
# falhou" (label pipeline-falhou), que fecha sozinha quando um release
# terminar verde na ponta da main (npm em dia com a main).
#
# Gatilhos: push na main que toque package.json, data/ ou logos/ (merge humano
# do PR semanal, bump manual, dataset alterado à mão) e workflow_dispatch (o
# update-logos.yml chama após o auto-merge, porque eventos feitos com o
# GITHUB_TOKEN não disparam gatilhos de push). data/ e logos/ estão aí para
# que dataset novo sem bump não fique fora do npm em silêncio: com a versão
# já publicada, o passo de versão órfã falha e abre o alerta (a não ser que
# a main já esteja numa versão mais nova, cujo push publica). Push só de
# workflows, docs ou código sem bump não dispara release. Autenticação no
# npm: trusted publishing (OIDC, sem segredo) quando configurado no
# npmjs.com; senão, o secret NPM_TOKEN (legado — expira). Ver RUNBOOK.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json, 'data/**', 'logos/**']

permissions:
  contents: write
  issues: write
  id-token: write # OIDC: trusted publishing + provenance no npm

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags completas para o guard de idempotência

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verificar o que falta para esta versão
        id: guard
        run: |
          v=$(node -p "require('./package.json').version")
          echo "versao=$v" >> "$GITHUB_OUTPUT"
          if [ -z "$(git tag -l "v$v")" ]; then
            echo "criar_tag=true" >> "$GITHUB_OUTPUT"
          fi
          # Distingue "versão não existe" (publicar) de erro de rede/registry
          # (falhar): tratar erro como "não publicado" causaria publish em falso.
          set +e
          saida=$(npm view "logos-bancos-br@$v" version 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ] && [ -n "$saida" ]; then
            echo "npm já tem a versão $v"
          elif { [ $rc -ne 0 ] && echo "$saida" | grep -q 'E404'; } || { [ $rc -eq 0 ] && [ -z "$saida" ]; }; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm view falhou de forma inesperada:"
            echo "$saida"
            exit 1
          fi

      - name: Detectar versão órfã (nada a fazer, mas main difere do publicado)
        if: ${{ !steps.guard.outputs.publicar }}
        run: |
          v='${{ steps.guard.outputs.versao }}'
          # Commit publicado: a tag ou, sem tag (publish ok e tag falhou), o
          # gitHead que o npm registrou.
          base=$(git rev-parse -q --verify "refs/tags/v$v^{commit}" || npm view "logos-bancos-br@$v" gitHead)
          [ -n "$base" ] || { echo "::error::não sei de que commit a v$v foi publicada"; exit 1; }
          if git diff --quiet "$base" "$GITHUB_SHA" -- data logos; then
            echo "Nada a fazer: v$v já publicada e o dataset não mudou."
            exit 0
          fi
          # Dados e bump em pushes separados: se a main já está em outra
          # versão, o run do push dela publica o dataset atual. Este run, de um
          # commit anterior, só sai.
          git fetch -q origin main
          v_main=$(git show origin/main:package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
          if [ "$v_main" != "$v" ]; then
            echo "::notice::a main já está na versão $v_main; o release dela publica o dataset atual."
            exit 0
          fi
          echo "::error::v$v já foi publicada a partir de outro commit e o dataset da main é diferente — faça um bump de versão para publicar o conteúdo atual."
          exit 1

      - name: Instalar dependências
        if: steps.guard.outputs.publicar || steps.guard.outputs.criar_tag
        run: npm ci

      - name: Testes
        if: steps.guard.outputs.publicar
        run: npm test

      # Trusted publishing exige npm >= 11.5.1; o Node 22 traz o npm 10.
      - name: Atualizar o npm
        if: steps.guard.outputs.publicar
        run: npm install -g npm@11

      # Pacote quebrado nunca chega ao npm: testa o tarball (com o mesmo npm
      # que publica) antes do publish, cujo prepublishOnly refaz o mesmo build.
      - name: Build do pacote
        if: steps.guard.outputs.publicar
        run: npm run build

      - name: Teste do pacote empacotado
        if: steps.guard.outputs.publicar
        run: npm run test:package

      # O npm tenta OIDC (trusted publishing) primeiro e só usa o NPM_TOKEN se
      # o pacote não tiver trusted publisher configurado no npmjs.com. Token
      # vencido aparece como "E404 Not Found - PUT" (RUNBOOK).
      - name: Publicar no npm
        if: steps.guard.outputs.publicar
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Criar tag + Release no GitHub
        if: steps.guard.outputs.criar_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v='${{ steps.guard.outputs.versao }}'
          alvo=$GITHUB_SHA
          # Versão que já estava no npm (só faltava a tag): marca o commit publicado.
          if [ -z '${{ steps.guard.outputs.publicar }}' ]; then alvo=$(npm view "logos-bancos-br@$v" gitHead); fi
          gh release create "v$v" --target "$alvo" --title "v$v" --generate-notes

      # Run verde na ponta da main = npm em dia com a main (publicou agora, ou
      # a versão já estava lá com o mesmo dataset): resolve o alerta de
      # release. Nunca deixa o release vermelho por isso (continue-on-error).
      - name: Fechar alerta de release (npm em dia com a main)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          # A main pode ter andado só em arquivos que não disparam release (docs,
          # workflows): aí nenhum run mais novo vem, e este é o último a falar.
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- package.json data logos; then
            echo 'A main mudou package.json, data/ ou logos/ depois deste commit; o run do push mais novo cuida do alerta.'
            exit 0
          fi
          titulo='Release automático falhou'
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for issue in $(gh issue list --label pipeline-falhou --state open --json number,title \
            --jq ".[] | select(.title == \"$titulo\") | .number"); do
            gh issue close "$issue" --comment "Release voltou a funcionar, npm em dia com a main: $url"
          done

      - name: Alertar falha (dead-man's switch)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Casa pelo título: a mesma label marca os alertas do pipeline
          # semanal e do guard de permanência, que são outros assuntos. Fecha
          # no passo anterior, num release verde na ponta da main.
          titulo='Release automático falhou'
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          aberta=$(gh issue list --label pipeline-falhou --state open --json number,title \
            --jq "first(.[] | select(.title == \"$titulo\")).number")
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "Release falhou: $url. Para tentar de novo, rode \`gh workflow run release.yml --ref main\` (não use Re-run em run antigo)."
          else
            gh issue create --title "$titulo" --label pipeline-falhou \
              --body "O release não completou: o npm e o CDN podem estar atrás da main. Para tentar de novo, rode \`gh workflow run release.yml --ref main\` (o Re-run de um run antigo repete o commit e o workflow daquele run). Esta issue fecha sozinha no próximo release verde na ponta da main. Run: $url"
          fi
